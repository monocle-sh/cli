[package]
name = "monocle-native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
# Same version as the Monocle symbolicator, so uploads are parsed exactly as the server parses them.
# The default features are required: symbolic-debuginfo 13.9 does not compile with a subset.
symbolic-common = "13.9.0"
symbolic-debuginfo = "13.9.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
